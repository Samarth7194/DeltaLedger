name: Backend Phase 2.5 Tests

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend
        working-directory: backend
        run: python -m pip install -e ".[dev]"
      - name: Ruff
        working-directory: backend
        run: python -m ruff check app tests --no-cache
      - name: Unit tests
        working-directory: backend
        run: python -m pytest -m unit -q

  postgres-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:0.8.0-pg16
        env:
          POSTGRES_USER: deltaledger
          POSTGRES_PASSWORD: deltaledger
          POSTGRES_DB: deltaledger
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U deltaledger -d deltaledger"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      APP_PROFILE: ci
      PG_ASYNC_SCHEME: postgresql+asyncpg
      PG_SYNC_SCHEME: postgresql+psycopg
      PG_AUTH: deltaledger:deltaledger
      REDIS_URL: redis://localhost:6379/0
      RUN_INTEGRATION_TESTS: "1"
      RUN_POSTGRES_TESTS: "1"
      OBJECT_STORAGE_PROVIDER: filesystem
      EMBEDDING_PROVIDER: fake
      RERANKER_PROVIDER: fake
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Create test database
        env:
          PGPASSWORD: deltaledger
        run: psql -h localhost -p 5433 -U deltaledger -d deltaledger -c "CREATE DATABASE deltaledger_test;"
      - name: Install backend
        working-directory: backend
        run: python -m pip install -e ".[dev]"
      - name: Migration upgrade
        working-directory: backend
        env:
          DATABASE_URL: ${{ env.PG_ASYNC_SCHEME }}://${{ env.PG_AUTH }}@localhost:5433/deltaledger_test
          ALEMBIC_DATABASE_URL: ${{ env.PG_SYNC_SCHEME }}://${{ env.PG_AUTH }}@localhost:5433/deltaledger_test
        run: python -m alembic upgrade head
      - name: Migration current
        working-directory: backend
        env:
          DATABASE_URL: ${{ env.PG_ASYNC_SCHEME }}://${{ env.PG_AUTH }}@localhost:5433/deltaledger_test
          ALEMBIC_DATABASE_URL: ${{ env.PG_SYNC_SCHEME }}://${{ env.PG_AUTH }}@localhost:5433/deltaledger_test
        run: python -m alembic current
      - name: Migration downgrade and upgrade
        working-directory: backend
        env:
          DATABASE_URL: ${{ env.PG_ASYNC_SCHEME }}://${{ env.PG_AUTH }}@localhost:5433/deltaledger_test
          ALEMBIC_DATABASE_URL: ${{ env.PG_SYNC_SCHEME }}://${{ env.PG_AUTH }}@localhost:5433/deltaledger_test
        run: |
          python -m alembic downgrade -1
          python -m alembic upgrade head
      - name: Postgres integration tests
        working-directory: backend
        env:
          DATABASE_URL: ${{ env.PG_ASYNC_SCHEME }}://${{ env.PG_AUTH }}@localhost:5433/deltaledger
          TEST_DATABASE_URL: ${{ env.PG_ASYNC_SCHEME }}://${{ env.PG_AUTH }}@localhost:5433/deltaledger_test
          ALEMBIC_DATABASE_URL: ${{ env.PG_SYNC_SCHEME }}://${{ env.PG_AUTH }}@localhost:5433/deltaledger
        run: python -m pytest -m "integration and postgres" -q

  redis-integration:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7.4.1-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      APP_PROFILE: ci
      REDIS_URL: redis://localhost:6379/0
      RUN_INTEGRATION_TESTS: "1"
      RUN_REDIS_TESTS: "1"
      EMBEDDING_PROVIDER: fake
      RERANKER_PROVIDER: fake
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend
        working-directory: backend
        run: python -m pip install -e ".[dev]"
      - name: Redis health CLI
        working-directory: backend
        run: python -m app.cli.health redis
      - name: Redis integration tests
        working-directory: backend
        run: python -m pytest -m "integration and redis" -q

  minio-integration:
    runs-on: ubuntu-latest
    env:
      APP_PROFILE: ci
      OBJECT_STORAGE_PROVIDER: minio
      RUN_INTEGRATION_TESTS: "1"
      RUN_MINIO_TESTS: "1"
      MINIO_ENDPOINT: http://localhost:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    steps:
      - uses: actions/checkout@v4
      - name: Start MinIO
        run: |
          docker run -d --name minio -p 9000:9000 \
            -e MINIO_ROOT_USER=minioadmin \
            -e MINIO_ROOT_PASSWORD \
            minio/minio:RELEASE.2024-07-31T05-46-26Z server /data
          for i in {1..30}; do
            curl -fsS http://localhost:9000/minio/health/ready && exit 0
            sleep 2
          done
          docker logs minio
          exit 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend
        working-directory: backend
        run: python -m pip install -e ".[dev]"
      - name: MinIO integration tests
        working-directory: backend
        run: python -m pytest -m "integration and minio" -q
