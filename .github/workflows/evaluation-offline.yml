name: Evaluation Offline

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  evaluation-offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend
        working-directory: backend
        run: python -m pip install -e ".[dev]"
      - name: Ruff
        working-directory: backend
        run: python -m ruff check app tests --no-cache --output-format=github
      - name: Evaluation tests
        working-directory: backend
        run: python -m pytest tests/test_phase8_metrics.py tests/test_phase8_runner.py -q
      - name: Run offline benchmark
        working-directory: backend
        run: python -m app.cli.evaluate --suite all --offline --output-dir evaluation/reports
      - name: Upload evaluation report
        uses: actions/upload-artifact@v4
        with:
          name: phase8-evaluation-report
          path: |
            backend/evaluation/reports/phase8_candidate_report.json
            backend/evaluation/reports/phase8_candidate_report.md
