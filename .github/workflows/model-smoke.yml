name: Manual Model Smoke Tests

on:
  workflow_dispatch:

jobs:
  model-smoke:
    runs-on: ubuntu-latest
    env:
      APP_PROFILE: ci
      RUN_MODEL_SMOKE: "1"
      HF_HOME: ${{ github.workspace }}/.hf-cache
      TRANSFORMERS_CACHE: ${{ github.workspace }}/.hf-cache
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend with AI extras
        working-directory: backend
        run: python -m pip install -e ".[dev,ai]"
      - name: Run model smoke tests
        working-directory: backend
        run: python -m pytest -m model_smoke -q
