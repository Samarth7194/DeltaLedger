name: Manual MinIO Integration

on:
  workflow_dispatch:

jobs:
  minio:
    runs-on: ubuntu-latest
    env:
      APP_PROFILE: ci
      OBJECT_STORAGE_PROVIDER: minio
      RUN_INTEGRATION_TESTS: "1"
      RUN_MINIO_TESTS: "1"
      MINIO_ENDPOINT: http://localhost:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: "1.22.x"
          cache: false
      - name: Start MinIO
        run: bash scripts/start_ci_minio.sh
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend
        working-directory: backend
        run: python -m pip install -e ".[dev]"
      - name: Run MinIO integration tests
        working-directory: backend
        run: python -m pytest -m "integration and minio" -q
      - name: Stop MinIO
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/minio.pid" ]; then
            kill "$(cat "$RUNNER_TEMP/minio.pid")" || true
          fi
