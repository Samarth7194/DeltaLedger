services:
  - type: web
    name: deltaledger-api
    runtime: python
    rootDir: backend
    plan: starter
    branch: main
    autoDeploy: true
    buildCommand: python -m pip install --upgrade pip setuptools wheel && python -m pip install -e .
    preDeployCommand: python -m alembic upgrade head
    startCommand: python -m uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/v1/health
    envVars:
      - key: APP_PROFILE
        value: production
      - key: ENVIRONMENT
        value: production
      - key: LOG_JSON
        value: "true"
      - key: READINESS_DEPENDENCY_CHECKS_ENABLED
        value: "true"
      - key: AUTH_ENABLED
        value: "true"
      - key: AUTH_SECRET_KEY
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: ALEMBIC_DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: WORKFLOW_CHECKPOINT_PROVIDER
        value: postgres
      - key: OBJECT_STORAGE_PROVIDER
        value: minio
      - key: MINIO_ENDPOINT
        sync: false
      - key: MINIO_ACCESS_KEY
        sync: false
      - key: MINIO_SECRET_KEY
        sync: false
      - key: MINIO_BUCKET_FILINGS
        sync: false
      - key: MINIO_BUCKET_REPORTS
        sync: false
      - key: SEC_USER_AGENT
        sync: false
      # --- AI pipeline: the API and the worker MUST use identical values -------------
      # (compare the `config_fingerprint` in both services' startup logs, or run
      #  `python -m app.cli.production_doctor`).
      # Fake providers are refused in production; there is deliberately no
      # ALLOW_FAKE_MODELS_IN_PRODUCTION override here.
      # Embeddings: hosted BGE-large (see docs/deployment.md, "Embeddings on Render").
      # The local sentence_transformers provider is NOT used on Render: it needs the
      # `[ai]` extra (torch) and ~2 GB of RAM, which the starter plan does not have.
      - key: EMBEDDING_PROVIDER
        value: huggingface_inference
      - key: EMBEDDING_MODEL
        value: BAAI/bge-large-en-v1.5
      - key: EMBEDDING_MODEL_NAME
        value: BAAI/bge-large-en-v1.5
      - key: HF_TOKEN
        sync: false
      - key: CHANGE_CLASSIFIER_PROVIDER
        sync: false
      - key: CHANGE_CLASSIFIER_MODEL
        sync: false
      - key: CLAIM_EXTRACTOR_PROVIDER
        sync: false
      - key: CLAIM_EXTRACTOR_MODEL
        sync: false
      - key: CONTRADICTION_CLASSIFIER_PROVIDER
        sync: false
      - key: CONTRADICTION_CLASSIFIER_MODEL
        sync: false
      - key: AI_PROVIDER_BASE_URL
        sync: false
      - key: AI_PROVIDER_API_KEY
        sync: false
      - key: AI_PROVIDER_CHAT_DELAY_SECONDS
        sync: false
      - key: AI_BATCH_MAX_ITEMS
        value: "8"
      - key: AI_BATCH_INPUT_TOKEN_BUDGET
        value: "12000"
      - key: AI_BATCH_TOKEN_SAFETY_MARGIN
        value: "0.25"
      - key: AI_BATCH_MULTI_ITEM_REQUESTS
        value: "true"
      - key: ANALYSIS_WORKFLOW_TIME_LIMIT_SECONDS
        value: "10800"

  - type: worker
    name: deltaledger-worker
    runtime: python
    rootDir: backend
    plan: starter
    branch: main
    autoDeploy: true
    buildCommand: python -m pip install --upgrade pip setuptools wheel && python -m pip install -e .
    startCommand: dramatiq app.workers.tasks
    envVars:
      - key: APP_PROFILE
        value: production
      - key: ENVIRONMENT
        value: production
      - key: LOG_JSON
        value: "true"
      - key: READINESS_DEPENDENCY_CHECKS_ENABLED
        value: "true"
      - key: AUTH_ENABLED
        value: "true"
      - key: AUTH_SECRET_KEY
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: ALEMBIC_DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: WORKFLOW_CHECKPOINT_PROVIDER
        value: postgres
      - key: OBJECT_STORAGE_PROVIDER
        value: minio
      - key: MINIO_ENDPOINT
        sync: false
      - key: MINIO_ACCESS_KEY
        sync: false
      - key: MINIO_SECRET_KEY
        sync: false
      - key: MINIO_BUCKET_FILINGS
        sync: false
      - key: MINIO_BUCKET_REPORTS
        sync: false
      - key: SEC_USER_AGENT
        sync: false
      # --- AI pipeline: the API and the worker MUST use identical values -------------
      # (compare the `config_fingerprint` in both services' startup logs, or run
      #  `python -m app.cli.production_doctor`).
      # Fake providers are refused in production; there is deliberately no
      # ALLOW_FAKE_MODELS_IN_PRODUCTION override here.
      # Embeddings: hosted BGE-large (see docs/deployment.md, "Embeddings on Render").
      # The local sentence_transformers provider is NOT used on Render: it needs the
      # `[ai]` extra (torch) and ~2 GB of RAM, which the starter plan does not have.
      - key: EMBEDDING_PROVIDER
        value: huggingface_inference
      - key: EMBEDDING_MODEL
        value: BAAI/bge-large-en-v1.5
      - key: EMBEDDING_MODEL_NAME
        value: BAAI/bge-large-en-v1.5
      - key: HF_TOKEN
        sync: false
      - key: CHANGE_CLASSIFIER_PROVIDER
        sync: false
      - key: CHANGE_CLASSIFIER_MODEL
        sync: false
      - key: CLAIM_EXTRACTOR_PROVIDER
        sync: false
      - key: CLAIM_EXTRACTOR_MODEL
        sync: false
      - key: CONTRADICTION_CLASSIFIER_PROVIDER
        sync: false
      - key: CONTRADICTION_CLASSIFIER_MODEL
        sync: false
      - key: AI_PROVIDER_BASE_URL
        sync: false
      - key: AI_PROVIDER_API_KEY
        sync: false
      - key: AI_PROVIDER_CHAT_DELAY_SECONDS
        sync: false
      - key: AI_BATCH_MAX_ITEMS
        value: "8"
      - key: AI_BATCH_INPUT_TOKEN_BUDGET
        value: "12000"
      - key: AI_BATCH_TOKEN_SAFETY_MARGIN
        value: "0.25"
      - key: AI_BATCH_MULTI_ITEM_REQUESTS
        value: "true"
      - key: ANALYSIS_WORKFLOW_TIME_LIMIT_SECONDS
        value: "10800"
