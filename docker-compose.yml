services:
  postgres:
    image: pgvector/pgvector:0.8.0-pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-deltaledger}
      POSTGRES_TEST_DB: ${POSTGRES_TEST_DB:-deltaledger_test}
      POSTGRES_USER: ${POSTGRES_USER:-deltaledger}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-deltaledger}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7.4.1-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:RELEASE.2024-07-31T05-46-26Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio-init:
    image: minio/mc:RELEASE.2024-07-31T05-46-26Z
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
      MINIO_BUCKET_FILINGS: ${MINIO_BUCKET_FILINGS:-filings}
      MINIO_BUCKET_REPORTS: ${MINIO_BUCKET_REPORTS:-reports}
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD};
      mc mb --ignore-existing local/$${MINIO_BUCKET_FILINGS};
      mc mb --ignore-existing local/$${MINIO_BUCKET_REPORTS};
      "
    restart: "no"

  backend:
    build:
      context: ./backend
    env_file:
      - path: .env
        required: false
    environment:
      APP_PROFILE: docker
      OBJECT_STORAGE_PROVIDER: minio
      DATABASE_URL: ${DOCKER_DATABASE_URL}
      ALEMBIC_DATABASE_URL: ${DOCKER_ALEMBIC_DATABASE_URL}
      REDIS_URL: redis://redis:6379/0
      MINIO_ENDPOINT: http://minio:9000
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    restart: unless-stopped
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  worker:
    build:
      context: ./backend
    env_file:
      - path: .env
        required: false
    environment:
      APP_PROFILE: docker
      OBJECT_STORAGE_PROVIDER: minio
      DATABASE_URL: ${DOCKER_DATABASE_URL}
      ALEMBIC_DATABASE_URL: ${DOCKER_ALEMBIC_DATABASE_URL}
      REDIS_URL: redis://redis:6379/0
      MINIO_ENDPOINT: http://minio:9000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    restart: unless-stopped
    command: python -m dramatiq app.workers.tasks

volumes:
  postgres_data:
  redis_data:
  minio_data:
